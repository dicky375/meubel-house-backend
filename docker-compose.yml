version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: meubel_house_db_docker
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meubel_house
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meubel_house"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meubel_house_api_docker
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: meubel_house
      JWT_SECRET: meubel_house_docker_jwt_secret_2024
      JWT_REFRESH_SECRET: meubel_house_docker_refresh_secret_2024
      JWT_EXPIRY: 2h
      JWT_REFRESH_EXPIRY: 7d
      FRONTEND_URL: "*"
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
